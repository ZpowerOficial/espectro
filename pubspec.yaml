name: politico
description: "Espectro — motor nativo de avaliação política multidimensional (eixos bipolares e tríades), 100% offline."
publish_to: "none"
version: 2.5.0+3

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  google_mobile_ads: ^9.1.0
  path_provider: ^2.1.6
  pdf: ^3.13.1
  share_plus: ^13.3.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/figma/
    - assets/portraits/
    - assets/currents/
    - assets/data/study_media.json
    - assets/data/study_relations_extended.json
    - assets/data/twelve_axes.json
    - assets/data/twelve_axes_extra.json
    - assets/data/six_triangles.json
    - assets/data/six_triangles_extra.json
    - assets/data/ideological_currents.json
    - assets/data/personalities.json
    - assets/data/personalities_extended.json
    - assets/data/dossiers/
    - assets/data/parties_movements.json
    - assets/data/historical_eras.json
    - assets/data/books_catalog.json
    - assets/data/countries.json
    - assets/data/external_catalog.json

  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700
